[project]
name = "vaquita"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.1.62",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
vaquita = "vaquita.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaquita"]
